<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<meta name="supported-color-schemes" content="light">
<title>{{.Subject}}</title>
</head>
<body style="margin:0;padding:0;background:#f3f6fa;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background:#f3f6fa;">
<tr><td align="center" style="padding:24px 12px;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width:560px;background:#ffffff;border:1px solid #cfdbe8;border-radius:6px;font-family:-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:16px;line-height:1.5;color:#182633;">
<tr><td style="background:#182633;color:#ffffff;padding:16px 24px;font-size:20px;font-weight:600;border-radius:5px 5px 0 0;">Standblatt</td></tr>
<tr><td style="padding:24px;">
{{- range .Parts}}
{{- if .Link}}
<p style="margin:8px 0 4px;"><a href="{{.Link}}" style="display:inline-block;background:#182633;color:#ffffff;text-decoration:none;padding:10px 20px;border-radius:5px;font-weight:600;">{{.Text}}</a></p>
<p style="margin:0 0 16px;font-size:13px;color:#4f7299;word-break:break-all;"><a href="{{.Link}}" style="color:#4f7299;">{{.Link}}</a></p>
{{- else if .Table}}
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="margin:0 0 16px;border-collapse:collapse;font-size:14px;">
{{- range $i, $row := .Table}}
<tr>{{range $row}}{{if eq $i 0}}<th align="left" style="padding:6px 8px 6px 0;border-bottom:1px solid #cfdbe8;color:#4f7299;font-weight:600;">{{.}}</th>{{else}}<td style="padding:6px 8px 6px 0;border-bottom:1px solid #e7edf4;">{{.}}</td>{{end}}{{end}}</tr>
{{- end}}
</table>
{{- else}}
<p style="margin:0 0 16px;white-space:pre-line;">{{.Text}}</p>
{{- end}}
{{- end}}
</td></tr>
</table>
</td></tr>
</table>
</body>
</html>
