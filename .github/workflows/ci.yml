name: CI

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:

# A newer push to the same branch cancels the running workflow; tag runs always finish.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: standblatt
          POSTGRES_PASSWORD: standblatt
          POSTGRES_DB: standblatt
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U standblatt" --health-interval 2s --health-retries 30
    env:
      TEST_DATABASE_URL: postgres://standblatt:standblatt@localhost:5432/standblatt
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: mkdir -p internal/webui/dist && touch internal/webui/dist/index.html
      - run: test -z "$(gofmt -l cmd internal)"
      - run: go vet ./...
      - run: go test ./...

  funcdoc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: python3 scripts/funcdoc.py

  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: azure/setup-helm@v4
      - run: helm lint helm --set image.repository=r --set image.tag=t --set 'ingress.hosts[0]=example.org'

  # Type check and build run as two jobs, so binary and e2e do not wait for svelte-check.
  web-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run check

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: webui
          path: internal/webui/dist/
          retention-days: 1

  # This binary is what e2e tests and what docker-image ships.
  binary:
    runs-on: ubuntu-latest
    needs: web
    steps:
      - uses: actions/checkout@v5
        with:
          # git describe needs the full history with tags.
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@v5
        with:
          name: webui
          path: internal/webui/dist/
      - run: CGO_ENABLED=0 go build -trimpath -ldflags="-s -w -X main.version=$(git describe --tags --always)" -o bin/standblatt ./cmd/standblatt
      - uses: actions/upload-artifact@v4
        with:
          name: binary
          path: bin/standblatt
          retention-days: 1

  print-agent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: |
          version=$([ "$GITHUB_REF_TYPE" = tag ] && echo "$GITHUB_REF_NAME" || echo "${GITHUB_SHA::7}")
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH=$arch go build -trimpath -ldflags="-s -w -X main.version=$version" -o bin/standblatt-print-agent-linux-$arch ./cmd/print-agent
          done
      - uses: actions/upload-artifact@v4
        with:
          name: print-agent
          path: bin/standblatt-print-agent-linux-*
          retention-days: 7

  e2e:
    runs-on: ubuntu-latest
    needs: binary
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: standblatt
          POSTGRES_PASSWORD: standblatt
          POSTGRES_DB: standblatt
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U standblatt" --health-interval 2s --health-retries 30
      mail:
        # Dependabot does not update service images of workflows; the floating tag keeps up with compose.yaml.
        image: axllent/mailpit:latest
        ports: ["1025:1025", "8025:8025"]
    env:
      DATABASE_URL: postgres://standblatt:standblatt@localhost:5432/standblatt
      STANDBLATT_ADMIN_TOKEN: e2e-admin-token-e2e-admin-token-e2e
      STANDBLATT_METRICS_LISTEN: ""
      STANDBLATT_SIGNUP: "true"
      STANDBLATT_SMTP_HOST: localhost
      STANDBLATT_SMTP_PORT: "1025"
      MAILPIT: http://localhost:8025
      BASE_URL: http://localhost:8080
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          name: binary
          path: bin/
      - run: |
          chmod +x bin/standblatt
          ./bin/standblatt > standblatt.log 2>&1 &
          timeout 30 sh -c 'until curl -sf http://localhost:8080/healthz; do sleep 1; done'
      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - working-directory: e2e
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
          npx playwright test --project=e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results
          path: |
            standblatt.log
            e2e/test-results/
          retention-days: 7

  docker-image:
    runs-on: ubuntu-latest
    needs: [go, web-check, helm, e2e, binary]
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/${{ github.repository }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          name: binary
          path: bin/
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Master and tag runs of one commit share its image, whichever builds first: a second build has
      # different asset hashes, and pods of one tag would serve two SPA builds.
      - run: |
          chmod +x bin/standblatt
          sha="$IMAGE:${GITHUB_SHA::7}"
          moving="$IMAGE:$([ "$GITHUB_REF_TYPE" = tag ] && echo latest || echo bleeding_edge)"
          if docker manifest inspect "$sha" >/dev/null 2>&1; then docker pull "$sha"; else docker build -f docker/ci.Dockerfile -t "$sha" bin; fi
          docker tag "$sha" "$moving"
          docker push "$sha"
          docker push "$moving"
          if [ "$GITHUB_REF_TYPE" = tag ]; then docker tag "$sha" "$IMAGE:$GITHUB_REF_NAME" && docker push "$IMAGE:$GITHUB_REF_NAME"; fi

  # Flux pulls the chart from here (OCIRepository in the cluster's GitOps repo).
  chart:
    runs-on: ubuntu-latest
    needs: helm
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: azure/setup-helm@v4
      - run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          helm package helm --version "${GITHUB_REF_NAME#v}" --app-version "$GITHUB_REF_NAME"
          helm push standblatt-*.tgz "oci://ghcr.io/${{ github.repository_owner }}/charts"

  # A GitHub release with the changelog section of the version and the print agent binaries.
  release:
    runs-on: ubuntu-latest
    needs: [print-agent, docker-image]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          name: print-agent
          path: bin/
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v h="## [$version]" 'index($0, "## [") == 1 { p = index($0, h) == 1; next } p' CHANGELOG.md > notes.md
          test -s notes.md
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md bin/standblatt-print-agent-linux-*
