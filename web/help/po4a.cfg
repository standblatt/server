# po4a: the English help pages in ../src/help/en/ are the source; translations live in locales/<lang>.po
# (gettext, like the app's catalogs). l10n.py writes ../src/help/<lang>/ from them.
[po4a_langs] de fr it
[po4a_paths] locales/help.pot $lang:locales/$lang.po
[options] opt:"--option markdown --master-charset UTF-8 --localized-charset UTF-8 --keep 80"

